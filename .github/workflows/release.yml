name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 fonts-dejavu-core
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pyinstaller minesim.spec --distpath dist/minesim --workpath build/minesim
      - if: runner.os == 'Linux'
        run: dist/minesim/minesim/minesim --selftest
      - if: runner.os == 'Linux'
        run: dist/minesim/minesim/minesim --selftest-ui
      - if: runner.os == 'Windows'
        run: dist/minesim/minesim/minesim.exe --selftest
      - if: runner.os == 'Windows'
        run: dist/minesim/minesim/minesim.exe --selftest-ui
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf minesim-linux.tar.gz -C dist/minesim minesim
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -Command "Compress-Archive -Path 'dist/minesim/minesim/*' -DestinationPath minesim-windows.zip"
      - uses: softprops/action-gh-release@v1
        if: runner.os == 'Linux'
        with:
          files: minesim-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v1
        if: runner.os == 'Windows'
        with:
          files: minesim-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
