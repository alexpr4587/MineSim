[project]
name = "digscript"
version = "0.1.0"
description = "DigScript - a 2D top-down programming game"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DigScript contributors" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "platformdirs",
    "numpy>=2.5.4",
]

[project.scripts]
digscript = "digscript.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyinstaller",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["digscript_api.pyi", "docs/API.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/digscript/examples/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests",
]
